prepare_version:
  name: Prepare version
  description: Resolve and transactionally stage one allowlisted public V2.0 profile.
  fields:
    profile:
      name: Source profile
      description: Fixed controller-owned source profile.
      required: true
      selector:
        select:
          options:
            - public_patch_1
            - public_main

queue_prepare_version:
  name: Queue prepare version
  description: Queue one later public V2.0 prepare only while another mutation is active. The controller capability is default-off.
  fields:
    profile:
      name: Source profile
      description: Fixed controller-owned source profile bound immutably at admission.
      required: true
      selector:
        select:
          options:
            - public_patch_1
            - public_main

cancel_queued_prepare:
  name: Cancel queued prepare
  description: Cancel one exact unclaimed prepare queue entry. Claimed work cannot be cancelled or retried.
  fields:
    queue_id:
      name: Queue ID
      description: Canonical UUID returned for the queued request.
      required: true
      selector:
        text:

activate_prepared_version:
  name: Activate prepared version
  description: Restart the Lab for the exact verified deployment waiting for activation.
  fields:
    deployment_id:
      name: Deployment ID
      required: true
      selector:
        text:

deployment_status:
  name: Deployment status
  description: Read the controller ledger status for one deployment.
  fields:
    deployment_id:
      name: Deployment ID
      required: true
      selector:
        text:

controller_health:
  name: Controller health
  description: Read gateway, target, lock, package-ownership, and deployment readiness.

discard_prepared_version:
  name: Discard prepared version
  description: Restore the verified pre-activation package without restarting Home Assistant.
  fields:
    deployment_id:
      name: Deployment ID
      required: true
      selector:
        text:

rollback_deployment:
  name: Roll back deployment
  description: Restore the verified predecessor for a rollback-required deployment.
  fields:
    deployment_id:
      name: Deployment ID
      required: true
      selector:
        text:
