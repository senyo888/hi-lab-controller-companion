      - type: grid
        column_span: 2
        background:
          color: "#7a4d00"
          opacity: 20
        cards:
          - type: heading
            heading: Queue evidence
            heading_style: title
            icon: mdi:tray-arrow-down
            grid_options:
              columns: full
              rows: 1

          - type: markdown
            title: Bounded prepare queue
            content: |
              {% set feed = states('sensor.hi_lab_controller_feed') %}
              {% set queue = states('sensor.hi_lab_controller_prepare_queue') %}
              {% if feed != 'fresh' or queue in ['unknown', 'unavailable', 'UNAVAILABLE', ''] %}
              **Queue evidence unavailable.** Its enablement, depth and entries cannot be inferred.
              {% else %}
              - Queue state: `{{ queue }}`
              {% set value = state_attr('sensor.hi_lab_controller_prepare_queue', 'enabled') %}
              - Enabled: `{{ value if value is not none else 'not reported' }}`
              {% set value = state_attr('sensor.hi_lab_controller_prepare_queue', 'depth') %}
              - Depth: `{{ value if value is not none else 'not reported' }}`
              {% set value = state_attr('sensor.hi_lab_controller_prepare_queue', 'max_depth') %}
              - Maximum depth: `{{ value if value is not none else 'not reported' }}`
              {% if queue == 'DISABLED' %}
              **Disabled by the controller.** No queue work is enabled.
              {% elif queue == 'EMPTY' %}
              **Enabled and empty.** No queued request is reported.
              {% endif %}
              {% set value = state_attr('sensor.hi_lab_controller_prepare_queue', 'entries') %}
              - Bounded entries: `{{ value if value is not none else 'not reported' }}`
              {% endif %}

              Queue enablement and dispatch remain controller-owned.
            grid_options:
              columns: 12
              rows: 4

          - type: markdown
            title: Evidence boundary
            content: |
              Queue truth is evidence only. Enablement, admission, cancellation, claim,
              dispatch, restart, and acceptance remain separate controller-governed steps.
            grid_options:
              columns: 12
              rows: 4
