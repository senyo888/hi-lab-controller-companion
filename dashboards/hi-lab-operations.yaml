title: HI Lab Controller
views:
  - title: Operations
    path: hi-lab-controller
    icon: mdi:shield-home-outline
    show_icon_and_title: true
    type: sections
    max_columns: 2
    dense_section_placement: false
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: markdown
        content: |
          <div align="center">
            <img src="/local/hi-lab-controller/companion-dashboard-header.png"
                 alt="HI Lab Controller Companion dashboard header" width="100%">
          </div>

          # HI Lab Controller

          **A calm, read-only view of controller truth.** Green marks an expected or
          clear state for that tile, amber needs attention, and red is blocked,
          invalid, stale, or unavailable. No tile colour declares overall health.
    sections:
      - type: grid
        background:
          color: "#0b2942"
          opacity: 28
        cards:
          - type: heading
            heading: System pulse
            heading_style: title
            icon: mdi:heart-pulse

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hi_lab_controller_feed
                state: fresh
            card:
              type: tile
              entity: sensor.hi_lab_controller_feed
              name: Signed feed
              icon: mdi:shield-check-outline
              color: green
              vertical: true
            grid_options:
              columns: 6
              rows: 2

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hi_lab_controller_feed
                state_not: fresh
            card:
              type: tile
              entity: sensor.hi_lab_controller_feed
              name: Signed feed
              icon: mdi:shield-alert-outline
              color: red
              vertical: true
            grid_options:
              columns: 6
              rows: 2

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hi_lab_controller_readiness
                state: READY
            card:
              type: tile
              entity: sensor.hi_lab_controller_readiness
              name: Controller
              icon: mdi:check-decagram-outline
              color: green
              vertical: true
            grid_options:
              columns: 6
              rows: 2

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hi_lab_controller_readiness
                state: BLOCKED
            card:
              type: tile
              entity: sensor.hi_lab_controller_readiness
              name: Controller
              icon: mdi:alert-decagram-outline
              color: red
              vertical: true
            grid_options:
              columns: 6
              rows: 2

          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: sensor.hi_lab_controller_readiness
                    state: unknown
                  - condition: state
                    entity: sensor.hi_lab_controller_readiness
                    state: unavailable
            card:
              type: tile
              entity: sensor.hi_lab_controller_readiness
              name: Controller truth
              icon: mdi:alert-decagram-outline
              color: red
              vertical: true
            grid_options:
              columns: 6
              rows: 2

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hi_lab_controller_mutation_lock
                state: CLEAR
            card:
              type: tile
              entity: sensor.hi_lab_controller_mutation_lock
              name: Mutation lock
              icon: mdi:lock-open-check-outline
              color: green
              vertical: true
            grid_options:
              columns: 6
              rows: 2

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hi_lab_controller_mutation_lock
                state: HELD
            card:
              type: tile
              entity: sensor.hi_lab_controller_mutation_lock
              name: Mutation lock
              icon: mdi:lock-clock
              color: amber
              vertical: true
            grid_options:
              columns: 6
              rows: 2

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hi_lab_controller_mutation_lock
                state_not: CLEAR
              - condition: state
                entity: sensor.hi_lab_controller_mutation_lock
                state_not: HELD
            card:
              type: tile
              entity: sensor.hi_lab_controller_mutation_lock
              name: Mutation lock
              icon: mdi:lock-alert-outline
              color: red
              vertical: true
            grid_options:
              columns: 6
              rows: 2

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.hi_lab_controller_restart_required
                state: "off"
            card:
              type: tile
              entity: binary_sensor.hi_lab_controller_restart_required
              name: Restart
              icon: mdi:restart-off
              color: green
              vertical: true
            grid_options:
              columns: 6
              rows: 2

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.hi_lab_controller_restart_required
                state: "on"
            card:
              type: tile
              entity: binary_sensor.hi_lab_controller_restart_required
              name: Restart
              icon: mdi:restart-alert
              color: amber
              vertical: true
            grid_options:
              columns: 6
              rows: 2

          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: binary_sensor.hi_lab_controller_restart_required
                    state: unknown
                  - condition: state
                    entity: binary_sensor.hi_lab_controller_restart_required
                    state: unavailable
            card:
              type: tile
              entity: binary_sensor.hi_lab_controller_restart_required
              name: Restart truth
              icon: mdi:restart-alert
              color: red
              vertical: true
            grid_options:
              columns: 6
              rows: 2

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hi_lab_controller_feed
                state_not: fresh
            card:
              type: markdown
              title: Feed needs attention
              content: |
                Legacy deployment truth is not available while **Feed** is not `fresh`.
                Observation reporting has its own independent feed.

                - Current feed: `{{ states('sensor.hi_lab_controller_feed') }}`
                - Error: `{{ state_attr('sensor.hi_lab_controller_feed', 'error_code') or 'none reported' }}`

                `stale`, `missing`, `invalid_signature`, `schema_mismatch`,
                `clock_invalid`, `unknown`, and `unavailable` remain distinct.

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hi_lab_controller_readiness
                state: BLOCKED
            card:
              type: markdown
              title: Controller is blocked
              content: |
                - Blockers: `{{ state_attr('sensor.hi_lab_controller_readiness', 'blocker_codes') }}`
                - Overflow: `{{ state_attr('sensor.hi_lab_controller_readiness', 'overflow_count') }}`

                Resolve these in the external controller workflow. This surface cannot clear them.

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hi_lab_controller_mutation_lock
                state_not: CLEAR
            card:
              type: markdown
              title: Mutation lock is not clear
              content: |
                - State: `{{ states('sensor.hi_lab_controller_mutation_lock') }}`
                - Owner: `{{ state_attr('sensor.hi_lab_controller_mutation_lock', 'owner_kind') or 'none reported' }}`
                - Deployment: `{{ state_attr('sensor.hi_lab_controller_mutation_lock', 'deployment_id') or 'none reported' }}`

      - type: grid
        background:
          color: "#18334a"
          opacity: 24
        cards:
          - type: heading
            heading: Contact and restart
            heading_style: title
            icon: mdi:history

          - type: tile
            entity: sensor.hi_lab_controller_last_contact
            name: Last valid controller contact
            icon: mdi:clock-check-outline
            color: teal
            vertical: false
            state_content: state
            grid_options:
              columns: 12
              rows: 2

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.hi_lab_controller_restart_required
                state: "off"
            card:
              type: markdown
              title: Restart not required
              content: |
                The controller currently reports no restart requirement. This is
                evidence only, not standing restart authority.
            grid_options:
              columns: 12
              rows: 2

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.hi_lab_controller_restart_required
                state: "on"
            card:
              type: markdown
              title: Restart required
              content: |
                The controller reports a restart requirement for the exact pending lifecycle.
                This is evidence, **not permission to restart**.

                - Deployment: `{{ state_attr('binary_sensor.hi_lab_controller_restart_required', 'deployment_id') or 'none reported' }}`
                - Reason: `{{ state_attr('binary_sensor.hi_lab_controller_restart_required', 'reason_code') or 'none reported' }}`
                - Approved: `{{ state_attr('binary_sensor.hi_lab_controller_restart_required', 'approved') }}`
            grid_options:
              columns: 12
              rows: 4

          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: binary_sensor.hi_lab_controller_restart_required
                    state: unknown
                  - condition: state
                    entity: binary_sensor.hi_lab_controller_restart_required
                    state: unavailable
            card:
              type: markdown
              title: Restart truth unavailable
              content: |
                No durable controller restart fact is available. This does not mean restart-not-required, and a completed observation soak does not supply restart truth.
            grid_options:
              columns: 12
              rows: 2

      - type: grid
        background:
          color: "#0d6f73"
          opacity: 22
        cards:
          - type: heading
            heading: Deployment lifecycle
            heading_style: title
            icon: mdi:package-variant-closed

          - type: markdown
            content: |
              ## Three separate facts

              Active, pending, and accepted baseline are independent. The dashboard
              never infers acceptance from matching identities.
            grid_options:
              columns: 12
              rows: 3
          - type: markdown
            title: Deployment evidence
            content: |
              {% set feed = states('sensor.hi_lab_controller_feed') %}
              {% set active = states('sensor.hi_lab_controller_active_deployment') %}
              {% if feed != 'fresh' %}
              **Deployment identity unavailable:** the signed deployment feed is `{{ feed }}`.
              {% elif active in ['unknown', 'unavailable', ''] %}
              **Active identity unproved.** The controller cannot identify a managed active deployment. See its blocker codes; a running integration or completed soak is not deployment provenance.
              {% elif active == 'none' %}
              **No managed active deployment is recorded.** This does not mean the integration is stopped.
              {% else %}
              **Managed active deployment:** `{{ active }}`.
              {% endif %}
              {% if feed == 'fresh' and states('sensor.hi_lab_controller_pending_deployment') == 'none' %}
              **No pending deployment** is reported.
              {% endif %}
              Historical baseline and deployment outcomes retain their own dates. They do not accept or identify the current package.

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hi_lab_controller_active_deployment
                state_not: none
              - condition: state
                entity: sensor.hi_lab_controller_active_deployment
                state_not: unknown
              - condition: state
                entity: sensor.hi_lab_controller_active_deployment
                state_not: unavailable
            card:
              type: tile
              entity: sensor.hi_lab_controller_active_deployment
              name: Active deployment
              icon: mdi:package-variant-closed
              color: cyan
              vertical: true
            grid_options:
              columns: 6
              rows: 2

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hi_lab_controller_active_deployment
                state: none
            card:
              type: tile
              entity: sensor.hi_lab_controller_active_deployment
              name: No active deployment
              icon: mdi:package-variant-remove
              color: blue-grey
              vertical: true
            grid_options:
              columns: 6
              rows: 2

          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: sensor.hi_lab_controller_active_deployment
                    state: unknown
                  - condition: state
                    entity: sensor.hi_lab_controller_active_deployment
                    state: unavailable
            card:
              type: tile
              entity: sensor.hi_lab_controller_active_deployment
              name: Active deployment truth
              icon: mdi:package-variant-remove
              color: red
              vertical: true
            grid_options:
              columns: 6
              rows: 2

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hi_lab_controller_pending_deployment
                state: none
            card:
              type: tile
              entity: sensor.hi_lab_controller_pending_deployment
              name: Pending deployment
              icon: mdi:package-variant-remove
              color: green
              vertical: true
            grid_options:
              columns: 6
              rows: 2

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hi_lab_controller_pending_deployment
                state_not: none
              - condition: state
                entity: sensor.hi_lab_controller_pending_deployment
                state_not: unknown
              - condition: state
                entity: sensor.hi_lab_controller_pending_deployment
                state_not: unavailable
            card:
              type: tile
              entity: sensor.hi_lab_controller_pending_deployment
              name: Pending deployment
              icon: mdi:package-variant
              color: amber
              vertical: true
            grid_options:
              columns: 6
              rows: 2

          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: sensor.hi_lab_controller_pending_deployment
                    state: unknown
                  - condition: state
                    entity: sensor.hi_lab_controller_pending_deployment
                    state: unavailable
            card:
              type: tile
              entity: sensor.hi_lab_controller_pending_deployment
              name: Pending truth
              icon: mdi:package-variant-remove
              color: red
              vertical: true
            grid_options:
              columns: 6
              rows: 2

      - type: grid
        background:
          color: "#123c43"
          opacity: 22
        cards:
          - type: heading
            heading: Baseline acceptance
            heading_style: title
            icon: mdi:database-check-outline

          - type: conditional
            conditions:
            - condition: state
              entity: sensor.hi_lab_controller_accepted_baseline
              state: none
            card:
              type: tile
              entity: sensor.hi_lab_controller_accepted_baseline
              name: Historical accepted baseline
              icon: mdi:database-off-outline
              color: amber
              vertical: false
            grid_options:
              columns: 12
              rows: 3

          - type: conditional
            conditions:
            - condition: state
              entity: sensor.hi_lab_controller_accepted_baseline
              state_not: none
            - condition: state
              entity: sensor.hi_lab_controller_accepted_baseline
              state_not: unknown
            - condition: state
              entity: sensor.hi_lab_controller_accepted_baseline
              state_not: unavailable
            card:
              type: tile
              entity: sensor.hi_lab_controller_accepted_baseline
              name: Historical accepted baseline
              icon: mdi:database-check-outline
              color: green
              vertical: false
            grid_options:
              columns: 12
              rows: 3

          - type: conditional
            conditions:
            - condition: or
              conditions:
              - condition: state
                entity: sensor.hi_lab_controller_accepted_baseline
                state: unknown
              - condition: state
                entity: sensor.hi_lab_controller_accepted_baseline
                state: unavailable
            card:
              type: tile
              entity: sensor.hi_lab_controller_accepted_baseline
              name: Historical accepted baseline
              icon: mdi:database-alert-outline
              color: red
              vertical: false
            grid_options:
              columns: 12
              rows: 3

          - type: markdown
            title: Acceptance boundary
            content: |
              The accepted baseline is a dated historical record, separate from the active or pending package. It does not accept a later version or a completed soak.
            grid_options:
              columns: 12
              rows: 2

      - type: grid
        column_span: 2
        background:
          color: "#7a4d00"
          opacity: 20
        cards:
          - type: heading
            heading: Validation, outcome and queue
            heading_style: title
            icon: mdi:clipboard-check-multiple-outline
            grid_options:
              columns: full
              rows: 1

          - type: tile
            entity: sensor.hi_lab_controller_last_validation
            name: Last validation
            icon: mdi:clipboard-clock-outline
            color: blue-grey
            vertical: false
            grid_options:
              columns: 12
              rows: 2

          - type: conditional
            conditions:
            - condition: or
              conditions:
              - condition: state
                entity: sensor.hi_lab_controller_last_outcome
                state: ACTIVE
              - condition: state
                entity: sensor.hi_lab_controller_last_outcome
                state: NO_CHANGE_EQUIVALENT_PACKAGE
            card:
              type: tile
              entity: sensor.hi_lab_controller_last_outcome
              name: Historical deployment outcome
              icon: mdi:check-circle-outline
              color: green
              vertical: false
            grid_options:
              columns: 12
              rows: 2

          - type: conditional
            conditions:
            - condition: or
              conditions:
              - condition: state
                entity: sensor.hi_lab_controller_last_outcome
                state: RESTORED_PRE_ACTIVATION
              - condition: state
                entity: sensor.hi_lab_controller_last_outcome
                state: ROLLED_BACK
            card:
              type: tile
              entity: sensor.hi_lab_controller_last_outcome
              name: Historical deployment outcome
              icon: mdi:restore-alert
              color: amber
              vertical: false
            grid_options:
              columns: 12
              rows: 2

          - type: conditional
            conditions:
            - condition: or
              conditions:
              - condition: state
                entity: sensor.hi_lab_controller_last_outcome
                state: BLOCKED
              - condition: state
                entity: sensor.hi_lab_controller_last_outcome
                state: FAILED_ACTIVATION
              - condition: state
                entity: sensor.hi_lab_controller_last_outcome
                state: FAILED_PRE_DEPLOY
              - condition: state
                entity: sensor.hi_lab_controller_last_outcome
                state: RECOVERY_REQUIRED
              - condition: state
                entity: sensor.hi_lab_controller_last_outcome
                state: unknown
              - condition: state
                entity: sensor.hi_lab_controller_last_outcome
                state: unavailable
            card:
              type: tile
              entity: sensor.hi_lab_controller_last_outcome
              name: Historical deployment outcome
              icon: mdi:alert-circle-outline
              color: red
              vertical: false
            grid_options:
              columns: 12
              rows: 2

          - type: conditional
            conditions:
            - condition: state
              entity: sensor.hi_lab_controller_last_outcome
              state: DISCARDED
            card:
              type: tile
              entity: sensor.hi_lab_controller_last_outcome
              name: Historical deployment outcome
              icon: mdi:package-variant-remove
              color: blue-grey
              vertical: false
            grid_options:
              columns: 12
              rows: 2

          - type: conditional
            conditions:
            - condition: state
              entity: sensor.hi_lab_controller_feed
              state: fresh
            - condition: state
              entity: sensor.hi_lab_controller_last_validation
              state_not: unknown
            - condition: state
              entity: sensor.hi_lab_controller_last_validation
              state_not: unavailable
            - condition: state
              entity: sensor.hi_lab_controller_last_validation
              state_not: none
            - condition: state
              entity: sensor.hi_lab_controller_last_validation
              state_not: ''
            card:
              type: entities
              title: Validation coverage
              show_header_toggle: false
              grid_options:
                columns: full
                rows: 4
              entities:
              - type: attribute
                entity: sensor.hi_lab_controller_last_validation
                attribute: installed_identity
                name: Installed identity
                icon: mdi:package-variant-closed-check
              - type: attribute
                entity: sensor.hi_lab_controller_last_validation
                attribute: stage_b_verdict
                name: Integration health
                icon: mdi:puzzle-check-outline
              - type: attribute
                entity: sensor.hi_lab_controller_last_validation
                attribute: stage_3_verdict
                name: Runtime truth
                icon: mdi:heart-pulse
            grid_options:
              columns: full
              rows: 4
          - type: conditional
            conditions:
            - condition: or
              conditions:
              - condition: state
                entity: sensor.hi_lab_controller_feed
                state_not: fresh
              - condition: state
                entity: sensor.hi_lab_controller_last_validation
                state: unknown
              - condition: state
                entity: sensor.hi_lab_controller_last_validation
                state: unavailable
              - condition: state
                entity: sensor.hi_lab_controller_last_validation
                state: none
              - condition: state
                entity: sensor.hi_lab_controller_last_validation
                state: ''
            card:
              type: markdown
              title: Deployment validation unavailable
              content: |
                **Deployment validation unavailable.** No current deployment-validation record is reported. Integration health (Stage B), runtime truth (Stage 3) and installed identity remain unproved.

                A completed observation soak is separate evidence; it does not supply Stage B/Stage 3 validation, loaded identity or baseline acceptance.
            grid_options:
              columns: full
              rows: 4

          - type: heading
            heading: Prepare queue
            heading_style: subtitle
            icon: mdi:tray-arrow-down
            grid_options:
              columns: full
              rows: 1

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hi_lab_controller_prepare_queue
                state: DISABLED
            card:
              type: tile
              entity: sensor.hi_lab_controller_prepare_queue
              name: Safe default
              icon: mdi:tray-remove
              color: blue-grey
              vertical: false
            grid_options:
              columns: 12
              rows: 3

          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hi_lab_controller_prepare_queue
                state: EMPTY
            card:
              type: tile
              entity: sensor.hi_lab_controller_prepare_queue
              name: Prepare queue
              icon: mdi:tray
              color: green
              vertical: false
            grid_options:
              columns: 12
              rows: 3

          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: sensor.hi_lab_controller_prepare_queue
                    state: WAITING
                  - condition: state
                    entity: sensor.hi_lab_controller_prepare_queue
                    state: FULL
            card:
              type: tile
              entity: sensor.hi_lab_controller_prepare_queue
              name: Prepare queue
              icon: mdi:tray-full
              color: amber
              vertical: false
            grid_options:
              columns: 12
              rows: 3

          - type: conditional
            conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity: sensor.hi_lab_controller_prepare_queue
                    state: BLOCKED
                  - condition: state
                    entity: sensor.hi_lab_controller_prepare_queue
                    state: DEGRADED
                  - condition: state
                    entity: sensor.hi_lab_controller_prepare_queue
                    state: UNAVAILABLE
                  - condition: state
                    entity: sensor.hi_lab_controller_prepare_queue
                    state: unknown
                  - condition: state
                    entity: sensor.hi_lab_controller_prepare_queue
                    state: unavailable
            card:
              type: tile
              entity: sensor.hi_lab_controller_prepare_queue
              name: Prepare queue
              icon: mdi:tray-alert
              color: red
              vertical: false
            grid_options:
              columns: 12
              rows: 3

          - type: markdown
            title: Queue context
            content: |
              {% set queue_state = states('sensor.hi_lab_controller_prepare_queue') %}
              {% if queue_state == 'DISABLED' %}
                **Disabled is the controller-owned safe default.** No request is waiting.
              {% elif queue_state == 'EMPTY' %}
                **Enabled and empty.** The controller reports no queued request.
              {% elif queue_state in ['WAITING', 'FULL'] %}
                **Queue state: `{{ queue_state }}`.** Bounded work is waiting.
              {% else %}
                **Queue needs attention: `{{ queue_state }}`.** Check controller evidence.
              {% endif %}

              Status only—this dashboard cannot retry, cancel, claim, dispatch, or enable work.
            grid_options:
              columns: 12
              rows: 3

          - type: markdown
            content: |
              ### Control boundary

              The companion's eight administrator actions remain in the dedicated
              operator workflow. They are intentionally absent here so a status glance
              cannot become an accidental mutation path.
            grid_options:
              columns: 12
              rows: 3

          - type: button
            name: Open Actions tool
            icon: mdi:hammer-wrench
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: /config/developer-tools/action
            grid_options:
              columns: 12
              rows: 3

  - title: Evidence
    path: hi-lab-controller-evidence
    icon: mdi:text-box-search-outline
    show_icon_and_title: true
    type: sections
    max_columns: 2
    dense_section_placement: false
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: markdown
        content: |
          # Controller evidence

          **Exact controller-authored detail for verification and diagnosis.** Identity,
          timing, validation, outcome, and queue evidence stay grouped here so the
          **Operations** view can remain calm. This page reports truth; it does not
          create or reinterpret it.
    sections:
      - type: grid
        background:
          color: "#0b2942"
          opacity: 28
        cards:
          - type: heading
            heading: Feed and deployment identity
            heading_style: title
            icon: mdi:shield-search

          - type: markdown
            title: Signed feed
            content: |
              - Feed: `{{ states('sensor.hi_lab_controller_feed') }}`
              {% if states('sensor.hi_lab_controller_feed') != 'fresh' %}
              **Deployment evidence is unavailable.** This is separate from the observation-reporting feed.
              {% endif %}
              {% set value = state_attr('sensor.hi_lab_controller_feed', 'error_code') %}
              - Feed error: `{{ value if value is not none else 'not reported' }}`
              {% set value = state_attr('sensor.hi_lab_controller_feed', 'observed_schema_major') %}
              - Observed schema major: `{{ value if value is not none else 'not reported' }}`
              {% set value = state_attr('sensor.hi_lab_controller_feed', 'supported_schema_majors') %}
              - Supported schema majors: `{{ value if value is not none else 'not reported' }}`
