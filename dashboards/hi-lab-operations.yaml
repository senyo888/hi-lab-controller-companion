      - type: grid
        background:
          color: "#0d6f73"
          opacity: 22
        cards:
          - type: heading
            heading: Readiness and result
            heading_style: title
            icon: mdi:clipboard-text-search-outline

          - type: markdown
            title: Readiness and lock
            content: |
              {% if states('sensor.hi_lab_controller_feed') != 'fresh' %}
              **Readiness and lock evidence unavailable.** A missing feed does not mean the mutation lock is clear.
              {% else %}
              - Readiness: `{{ states('sensor.hi_lab_controller_readiness') }}`
              {% set value = state_attr('sensor.hi_lab_controller_readiness', 'state_revision') %}
              - Status revision: `{{ value if value is not none else 'not reported' }}`
              {% set value = state_attr('sensor.hi_lab_controller_readiness', 'blocker_codes') %}
              - Blocker codes: `{{ value if value is not none else 'not reported' }}`
              {% set value = state_attr('sensor.hi_lab_controller_readiness', 'overflow_count') %}
              - Additional blockers: `{{ value if value is not none else 'not reported' }}`
              {% set lock = states('sensor.hi_lab_controller_mutation_lock') %}
              - Mutation lock: `{{ lock }}`
              {% if lock == 'CLEAR' %}
              **The controller reports the lock clear.** No lock owner or held-at timestamp applies. This does not prove deployment readiness.
              {% elif lock == 'HELD' %}
              {% set value = state_attr('sensor.hi_lab_controller_mutation_lock', 'owner_kind') %}
              - Lock owner kind: `{{ value if value is not none else 'not reported' }}`
              {% set value = state_attr('sensor.hi_lab_controller_mutation_lock', 'deployment_id') %}
              - Deployment: `{{ value if value is not none else 'not reported' }}`
              {% set value = state_attr('sensor.hi_lab_controller_mutation_lock', 'held_at') %}
              - Held at: `{{ value if value is not none else 'not reported' }}`
              {% else %}
              **Lock truth is not clear.** Do not infer an absent lock from missing details.
              {% endif %}
              {% endif %}

          - type: markdown
            title: Deployment validation evidence
            content: |
              {% set feed = states('sensor.hi_lab_controller_feed') %}
              {% set record = states('sensor.hi_lab_controller_last_validation') %}
              {% if feed != 'fresh' %}
              **Controller evidence unavailable.** The signed deployment feed is `{{ feed }}`; retained attributes are not current evidence.
              {% elif record in ['unknown', 'unavailable', ''] %}
              **Deployment validation unavailable.** No current deployment-validation record is reported. Integration health (Stage B), runtime truth (Stage 3) and installed identity remain unproved.
              {% elif record == 'none' %}
              **Deployment validation unavailable.** No current deployment-validation record is reported. Integration health (Stage B), runtime truth (Stage 3) and installed identity remain unproved.
              {% else %}
              - Record: `{{ record }}`
              {% set value = state_attr('sensor.hi_lab_controller_last_validation', 'deployment_id') %}
              - Deployment: `{{ value if value is not none else 'not reported' }}`
              {% set value = state_attr('sensor.hi_lab_controller_last_validation', 'installed_identity') %}
              - Installed identity: `{{ value if value is not none else 'not reported' }}`
              {% set value = state_attr('sensor.hi_lab_controller_last_validation', 'stage_b_verdict') %}
              - Integration health (Stage B): `{{ value if value is not none else 'not reported' }}`
              {% set value = state_attr('sensor.hi_lab_controller_last_validation', 'stage_b_passed') %}
              - Integration services available: `{{ value if value is not none else 'not reported' }}`
              {% set value = state_attr('sensor.hi_lab_controller_last_validation', 'stage_b_expected') %}
              - Integration services required: `{{ value if value is not none else 'not reported' }}`
              {% set value = state_attr('sensor.hi_lab_controller_last_validation', 'stage_3_verdict') %}
              - Runtime truth (Stage 3): `{{ value if value is not none else 'not reported' }}`
              {% set value = state_attr('sensor.hi_lab_controller_last_validation', 'stage_3_passed') %}
              - Runtime entities healthy: `{{ value if value is not none else 'not reported' }}`
              {% set value = state_attr('sensor.hi_lab_controller_last_validation', 'stage_3_expected') %}
              - Runtime entities expected: `{{ value if value is not none else 'not reported' }}`
              {% endif %}

              A completed observation soak is separate evidence; it does not supply Stage B/Stage 3 validation, loaded identity or baseline acceptance.

          - type: markdown
            title: Historical deployment outcome
            content: |
              {% set feed = states('sensor.hi_lab_controller_feed') %}
              {% set record = states('sensor.hi_lab_controller_last_outcome') %}
              {% if feed != 'fresh' %}
