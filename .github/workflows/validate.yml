name: Repository validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Unit and repository-contract tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.29.1"
          digest="e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${digest}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner .
